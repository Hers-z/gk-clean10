<script>
(function(){
  var ev = null, btn = null;
  window.addEventListener("beforeinstallprompt", function(e){
    e.preventDefault(); ev = e;
    try { if(localStorage.getItem("pm-noinst") === "1") return; } catch(x){}
    btn = document.createElement("button"); btn.type = "button"; btn.id = "pwa-install";
    btn.innerHTML = "📲 تثبيت التطبيق · Installer <span aria-label=\"x\" style=\"margin-inline-start:10px;opacity:.7\" data-x=\"1\">✕</span>";
    btn.style.cssText = "position:fixed;z-index:99999;inset-inline:16px;bottom:calc(16px + env(safe-area-inset-bottom));margin:auto;max-width:340px;padding:14px 18px;border:0;border-radius:99px;background:#0B7A86;color:#fff;font:700 16px system-ui,sans-serif;box-shadow:0 8px 24px rgba(0,0,0,.3);cursor:pointer";
    btn.onclick = function(c){
      if(c.target && c.target.getAttribute && c.target.getAttribute("data-x")){ try { localStorage.setItem("pm-noinst", "1"); } catch(x){} btn.remove(); return; }
      btn.remove(); ev.prompt();
    };
    document.addEventListener("DOMContentLoaded", function(){ document.body.appendChild(btn); });
    if(document.body) document.body.appendChild(btn);
  });
  window.addEventListener("appinstalled", function(){ if(btn) btn.remove(); });
})();
</script>

<style>
/* Layout: sticky top bar, tab row, one full-width table that turns into stacked cards on phones. */
:root{
  --bg:#F2F5F6; --surface:#FFFFFF; --surface2:#E8EEF0; --line:#D3DCE0; --fg:#10222A; --muted:#566B74;
  --accent:#0B7A86; --accent-fg:#FFFFFF; --accent-soft:#D5EDEF;
  --ok:#1B7F4B; --ok-soft:#DBF1E3; --warn:#9A5400; --warn-soft:#FBE8C8; --bad:#B3261E; --bad-soft:#F9DDDA;
  --f-display:"Cairo","IBM Plex Sans Arabic",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Arabic","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C1519; --surface:#142126; --surface2:#1B2D34; --line:#27404A; --fg:#E6EEF1; --muted:#93A8B1;
    --accent:#3CC1CE; --accent-fg:#06222A; --accent-soft:#12383E;
    --ok:#5FD08E; --ok-soft:#12301F; --warn:#F0B25A; --warn-soft:#3A2A10; --bad:#F2918A; --bad-soft:#3C1816;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C1519; --surface:#142126; --surface2:#1B2D34; --line:#27404A; --fg:#E6EEF1; --muted:#93A8B1;
  --accent:#3CC1CE; --accent-fg:#06222A; --accent-soft:#12383E;
  --ok:#5FD08E; --ok-soft:#12301F; --warn:#F0B25A; --warn-soft:#3A2A10; --bad:#F2918A; --bad-soft:#3C1816;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--f-body);min-height:100%;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
[hidden]{display:none!important}
img{max-width:100%}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1180px;margin-inline:auto;padding-bottom:48px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:11;background:var(--bg);display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding-block:12px;border-bottom:1px solid var(--line)}
.brand{font:800 20px/1 var(--f-display)}
.brand span{color:var(--accent)}
.spacer{flex:1 1 0}
.mode{font-size:12px;color:var(--muted);background:var(--surface2);padding:3px 10px;border-radius:99px;min-width:0}
.who{font-size:13px;color:var(--muted)}

.langs{display:flex;gap:2px;background:var(--surface2);border-radius:99px;padding:2px;direction:ltr}
.langs button{border:0;background:none;border-radius:99px;padding:5px 11px;cursor:pointer;font-size:13px;color:var(--muted)}
.langs button[aria-pressed="true"]{background:var(--surface);color:var(--fg);font-weight:600}
.bell{position:relative;gap:6px}
.badge{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:var(--bad);color:var(--surface);font-size:11px;font-weight:700}
.notif{display:flex;gap:10px;align-items:flex-start;width:100%;padding:10px 12px;border:0;border-top:1px solid var(--line);background:none;text-align:start;min-width:0}
.picklist .notif:first-child{border-top:0}
button.notif{cursor:pointer}
button.notif:hover{background:var(--surface2)}
.notif.unread{background:var(--accent-soft)}
.notif .t{flex:1;min-width:0}
.notif .t b,.notif .t span{display:block}
.notif .dot{flex:none;width:8px;height:8px;margin-top:7px;border-radius:99px;background:var(--accent);visibility:hidden}
.notif.unread .dot{visibility:visible}
.extrabox{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.extrabox label{flex:1 1 200px}
.subhead{padding:12px 14px 6px;font-size:13px;font-weight:600;color:var(--muted)}
.pad{padding:8px 14px;margin:0}
.wdet{border-top:1px solid var(--line);padding:8px 14px}
.wdet summary{cursor:pointer;padding:6px 0}
.tabs{display:flex;flex-wrap:wrap;gap:0 4px;margin-block:16px 0;border-bottom:1px solid var(--line)}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:10px 12px;cursor:pointer;color:var(--muted);font-weight:500;white-space:nowrap}
.tab[aria-current="true"]{color:var(--fg);border-bottom-color:var(--accent);font-weight:600}

h1,h2{font-family:var(--f-display);margin:0;line-height:1.25;text-wrap:balance}
h1{font-size:22px}
h2{font-size:17px}
.head{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;margin-block:20px 14px}
.head .spacer{flex:1 1 0}
.sub{color:var(--muted);font-size:14px;margin:4px 0 0}

.stats{display:flex;flex-wrap:wrap;gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:6px 12px;font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:baseline}
.stat b{font:800 18px var(--f-display);color:var(--fg);font-variant-numeric:tabular-nums}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:0 16px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:500}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:600}
.btn.primary:hover{filter:brightness(1.08);background:var(--accent)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.danger.sure{background:var(--bad);color:#fff}
.btn.ghost{background:none;border-color:transparent}
.btn.sm{min-height:32px;padding:0 10px;font-size:13px}
.btn.big{min-height:48px;font-size:16px;padding:0 22px}

select,input[type=text],input[type=password],input[type=number],input[type=time],input[type=datetime-local],input[type=date]{width:100%;min-height:40px;padding:0 10px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
input.num{width:72px;text-align:center;font-variant-numeric:tabular-nums}
.filter{width:auto;min-width:160px}

.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.tbl{border-collapse:collapse;width:100%;min-width:1340px}
.tbl th{font-size:12px;font-weight:600;color:var(--muted);text-align:start;padding:10px 12px;background:var(--surface2);white-space:nowrap;letter-spacing:.02em}
.tbl td{padding:10px 12px;border-top:1px solid var(--line);vertical-align:middle}
.tbl td.n{text-align:center;font-variant-numeric:tabular-nums}
.tbl .name .link{font-weight:600;font-size:15px}
.link{background:none;border:0;padding:0;color:var(--accent);cursor:pointer;text-align:start;text-decoration:underline;text-underline-offset:3px}
a.link{display:inline-block;font-size:13px}
.small{font-size:13px;color:var(--muted)}
.empty{padding:36px 16px;text-align:center;color:var(--muted)}
.nowrap{white-space:nowrap}
.rowact{display:flex;gap:6px;flex-wrap:wrap}

.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.pending{background:var(--surface2);color:var(--muted)}
.pill.progress{background:var(--warn-soft);color:var(--warn)}
.pill.done{background:var(--ok-soft);color:var(--ok)}
.pill.team{background:var(--accent-soft);color:var(--accent);font-family:var(--f-mono)}
.pill.none{background:var(--warn-soft);color:var(--warn)}
.code{font-family:var(--f-mono);font-weight:500;background:var(--surface2);border:1px dashed var(--line);border-radius:6px;padding:2px 10px;cursor:pointer;letter-spacing:.1em;direction:ltr;display:inline-block}

.overlay{position:fixed;inset:0;z-index:30;background:rgba(5,15,20,.6);overflow:auto;display:flex;justify-content:center;align-items:flex-start;
  padding:max(16px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.overlay.top2{z-index:40;align-items:center;background:rgba(0,0,0,.85)}
.modal{background:var(--surface);border-radius:12px;width:min(720px,100%);padding:20px;display:flex;flex-direction:column;gap:18px;min-width:0}
.mhead{display:flex;gap:12px;align-items:flex-start}
.mhead .spacer{flex:1 1 0}
.specs{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.spec{background:var(--surface2);border-radius:var(--r);padding:8px 12px}
.spec b{display:block;font:800 22px/1.2 var(--f-display);font-variant-numeric:tabular-nums}
.spec span{font-size:12px;color:var(--muted)}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px 16px}
.kv div span{display:block;font-size:12px;color:var(--muted)}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px;margin-top:8px}
.thumb{position:relative;aspect-ratio:1;border-radius:6px;overflow:hidden;background:var(--surface2);max-width:100%}
.thumb img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in}
.thumb .rm{position:absolute;top:4px;inset-inline-end:4px;width:26px;height:26px;border-radius:99px;border:0;background:rgba(0,0,0,.65);color:#fff;cursor:pointer;line-height:1}
.add{display:flex;align-items:center;justify-content:center;text-align:center;font-size:13px;color:var(--accent);border:1px dashed var(--accent);border-radius:6px;cursor:pointer;aspect-ratio:1;padding:6px;font-weight:600}
.add input{display:none}
.picklist{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);max-height:52vh;overflow:auto}
.pick{display:flex;gap:12px;align-items:center;padding:10px 12px;border-top:1px solid var(--line);cursor:pointer;min-width:0}
.pick:first-child{border-top:0}
.pick:hover{background:var(--surface2)}
.pick input{width:20px;height:20px;flex:none;accent-color:var(--accent)}
.pick .t{min-width:0;flex:1}
.pick .t b{display:block}
.city{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-top:14px;overflow:hidden}
.cityhead{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:10px 14px;background:var(--surface2)}
.cityhead h2{flex:1 1 140px;min-width:0}
.arow{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;padding:10px 14px;border-top:1px solid var(--line)}
.arow .t{flex:1 1 220px;min-width:0}
.arow .t b{display:block}
.btn.warn{color:var(--warn);border-color:var(--warn)}
.btn.stop{background:var(--bad);border-color:var(--bad);color:#fff;font-weight:600}
.pill.paused{background:var(--accent-soft);color:var(--accent)}
.grp{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-top:12px;overflow:hidden}
.gh{display:flex;align-items:center;gap:12px;width:100%;padding:12px 16px;min-height:60px;background:none;border:0;cursor:pointer;text-align:start}
.gh:hover{background:var(--surface2)}
.gh .gt{flex:1;min-width:0;font:700 17px/1.3 var(--f-display)}
.gh .gt small{display:block;font:400 13px var(--f-body);color:var(--muted)}
.gh .chev{flex:none;width:28px;height:28px;border-radius:99px;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--muted)}
.gbody{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,310px),1fr));gap:12px;padding:12px 14px 14px;border-top:1px solid var(--line)}
.hcard{border:1px solid var(--line);border-inline-start:4px solid var(--line);border-radius:10px;background:var(--bg);padding:12px 14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.hcard.s-progress{border-inline-start-color:var(--warn)}
.hcard.s-paused{border-inline-start-color:var(--accent)}
.hcard.s-done{border-inline-start-color:var(--ok)}
.hmain{display:flex;flex-direction:column;gap:3px;background:none;border:0;padding:0;text-align:start;cursor:pointer;min-width:0}
.hmain b{font:700 16px/1.3 var(--f-display)}
.hmain:hover b{color:var(--accent)}
.hrow{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px}
.fact{font-size:12px;background:var(--surface2);border-radius:6px;padding:2px 8px;color:var(--muted);white-space:nowrap}
.hacts{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto}
.hacts .btn{flex:1 1 auto}
.hacts select{flex:1 1 120px;min-height:32px;width:auto}
.tools{display:flex;gap:6px;flex-wrap:wrap}
.cover{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:8px;display:block;background:var(--surface2)}
.avatar{flex:none;width:52px;height:52px;border-radius:50%;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;background:var(--av,var(--accent));color:#fff;font:700 18px var(--f-display);letter-spacing:.02em;box-shadow:0 0 0 3px var(--surface),0 0 0 4px var(--line),0 4px 12px rgba(16,34,42,.15)}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.avup{position:relative;cursor:pointer;flex:none;display:inline-flex}
.avup input{display:none}
.avup .cam{position:absolute;bottom:-2px;inset-inline-end:-2px;width:28px;height:28px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;border:2px solid var(--surface);box-shadow:0 2px 6px rgba(0,0,0,.25)}
.avup:hover .avatar{filter:brightness(1.08)}
.avatar.lg{width:76px;height:76px;font-size:26px}
.avatar.sm{width:38px;height:38px;font-size:13px;box-shadow:0 0 0 2px var(--surface),0 0 0 3px var(--line)}
.hmain.withav{flex-direction:row;align-items:center;gap:14px;padding:4px}
.ht{display:flex;flex-direction:column;gap:2px;min-width:0;text-align:start}
.ht b{font:700 16px/1.3 var(--f-display);unicode-bidi:plaintext}
.ht .small{unicode-bidi:plaintext}
.mhead h1{unicode-bidi:plaintext}
.mhead{align-items:center;gap:14px}
.hero{position:relative;margin:-20px -20px 0;min-height:190px;border-radius:16px 16px 0 0;overflow:hidden;background:linear-gradient(135deg,var(--accent),#0A4F57);color:#fff;display:flex;align-items:flex-end}
.hero>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero::after,.chero::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.78),rgba(0,0,0,.05) 70%)}
.hcap{position:relative;z-index:1;display:block;padding:14px 18px;width:100%;text-align:start}
.hcap h1{color:#fff;font-size:22px;margin:0;direction:ltr;unicode-bidi:plaintext}
.hcap .addr{font-size:15px;opacity:.9}
.hcap a{color:#fff;text-decoration:underline}
.hclose{position:absolute;top:12px;inset-inline-start:12px;z-index:2;width:40px;height:40px;border-radius:99px;border:0;background:rgba(0,0,0,.55);color:#fff;font-size:18px;cursor:pointer}
.chero{position:relative;display:flex;align-items:flex-end;width:100%;aspect-ratio:16/10;border:0;padding:0;border-radius:8px;overflow:hidden;cursor:pointer;color:#fff;background:#222}
.chero>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .3s}
.chero:hover>img{transform:scale(1.04)}
.chero .hcap b{display:block;font:700 17px/1.3 var(--f-display);unicode-bidi:plaintext}
.chero .hcap span{display:block;font-size:13px;opacity:.9;unicode-bidi:plaintext}
.lbbar{position:fixed;inset-inline:0;bottom:max(14px,env(safe-area-inset-bottom,0px));display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap;padding:0 12px}
.lbbar .btn:disabled{opacity:.4;cursor:default}
.strip{display:flex;flex-direction:column;gap:6px}
.strip>b{font-size:13px;color:var(--muted);font-weight:600}
.thumbs.sm{grid-template-columns:repeat(auto-fill,minmax(64px,1fr));margin-top:0}
.calnav{display:flex;align-items:center;gap:10px;margin-block:6px 12px}
.calnav h2{flex:1;text-align:center;font-size:19px}
.calgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px;box-shadow:var(--sh)}
.calwd{text-align:center;font-size:12px;color:var(--muted);padding:4px 0;font-weight:600}
.calcell{display:flex;flex-direction:column;align-items:flex-start;gap:3px;min-height:82px;padding:6px;border:1px solid transparent;border-radius:10px;background:var(--bg);cursor:pointer;text-align:start;min-width:0;overflow:hidden}
.calcell.empty{background:none;cursor:default}
.calcell:not(.empty):hover{border-color:var(--accent)}
.calcell.today .cn{background:var(--accent);color:var(--accent-fg)}
.calcell.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.cn{font:700 13px var(--f-display);min-width:24px;height:24px;border-radius:99px;display:inline-flex;align-items:center;justify-content:center}
.cchips{display:flex;flex-direction:column;gap:2px;width:100%}
.cchip{display:block;font-size:11px;line-height:1.3;padding:1px 6px;border-radius:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:hsl(var(--th) 60% 88%);color:hsl(var(--th) 65% 22%)}
.cchip.dim{opacity:.55}
.cmore{font-size:11px;color:var(--muted)}
.cdots{display:none;gap:3px;flex-wrap:wrap}
.cdots i{width:7px;height:7px;border-radius:50%;background:hsl(var(--th) 60% 45%)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .cchip{background:hsl(var(--th) 35% 24%);color:hsl(var(--th) 70% 85%)}}
:root[data-theme="dark"] .cchip{background:hsl(var(--th) 35% 24%);color:hsl(var(--th) 70% 85%)}
@media (max-width:640px){.calcell{min-height:56px;align-items:center;padding:4px}.cchips{display:none}.cdots{display:flex;justify-content:center}}
.fab{position:fixed;z-index:20;width:52px;height:52px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-fg);font-size:26px;line-height:1;cursor:grab;touch-action:none;box-shadow:0 6px 18px rgba(5,15,20,.35);display:flex;align-items:center;justify-content:center;padding:0;user-select:none;-webkit-user-select:none}

async function compress(file){
  var max = LIVE ? 1280 : 800, q = LIVE ? 0.72 : 0.6, src, w, h, bmp = null, url = null;
  try { bmp = await createImageBitmap(file, {imageOrientation:"from-image"}); src = bmp; w = bmp.width; h = bmp.height; }
  catch(e){
    url = URL.createObjectURL(file);
    src = await new Promise(function(res, rej){ var im = new Image(); im.onload = function(){ res(im); }; im.onerror = rej; im.src = url; });
    w = src.naturalWidth; h = src.naturalHeight;
  }
  var sc = Math.min(1, max / Math.max(w, h)), c = document.createElement("canvas");
  c.width = Math.round(w * sc); c.height = Math.round(h * sc);
  c.getContext("2d").drawImage(src, 0, 0, c.width, c.height);
  if(bmp && bmp.close) bmp.close();
  if(url) URL.revokeObjectURL(url);
  return await new Promise(function(res, rej){ c.toBlob(function(b){ b ? res(b) : rej(new Error("compress")); }, "image/jpeg", q); });
}

async function uploadPhotos(hid, kind, files, tbl){
  var total = files.length, done = 0, failed = 0, next = 0, last = null;
  upBar(t("uploading") + " 0/" + total + " · " + t("photoWait"));
  async function worker(){
    while(next < total){
      var f = files[next++];
      try {
        var blob = await compress(f), url = null, tries = 0;
        while(true){
          try { url = await db.photo(hid, kind, blob); break; }
          catch(e){ if(e && e.message === "storage_full") throw e; if(++tries > 2) throw e; await new Promise(function(r){ setTimeout(r, 700 * tries); }); }
        }
        await saveUrl(hid, kind, url, tbl); done++;
      } catch(e){ failed++; last = e; console.error(e); }
      upBar(t("uploading") + " " + (done + failed) + "/" + total + " · " + t("photoWait"));
    }
  }
  await Promise.all([worker(), worker(), worker()]);
  upBar(null);
  try { await refresh(); } catch(e){}
  render();
  if(failed) toast(t("uploadFail").replace("{n}", failed) + (last && last.message === "storage_full" ? " " + t("storageFull") : (LIVE && last && last.message ? " (" + last.message + ")" : "")), "bad");
  else toast(t("saved"));
}

      if(table === "cleanings") (S.special_photos || []).forEach(function(x){ if(x.cleaning_id === id) x.cleaning_id = null; });
      S[table] = S[table].filter(function(x){ return x.id !== id; });
      if(table === "houses") S.services = (S.services || []).filter(function(x){ return x.house_id !== id; });
      S.workerDays = (S.workerDays || []).filter(function(r){ return !(table === "workers" && r.worker_id === id) && !(table === "teams" && r.team_id === id); });

function baseUrl(){
  var u = (CFG.url || "").trim();
  var m = /supabase\.com\/dashboard\/project\/([a-z0-9]+)/i.exec(u);
  if(m) return "https://" + m[1] + ".supabase.co";
  try { return new URL(u).origin; } catch(e){ return u; }
}
function liveDb(){
  var sb = window.supabase.createClient(baseUrl(), (CFG.key || "").trim());
  async function profile(uid_, email){
    var r = await sb.from("profiles").select("role,team_id").eq("id", uid_).single();
    if(r.error) throw r.error;
    var name = email;
    var slot = null;
    if(r.data.role === "inspector"){ try { var rn = await sb.rpc("my_inspector_name"); if(rn.data) name = rn.data; var rs = await sb.rpc("my_inspector_slot"); if(rs.data) slot = rs.data; } catch(x){} }
    if(r.data.team_id){ var tr = await sb.from("teams").select("name").eq("id", r.data.team_id).single(); if(tr.data) name = tr.data.name; }
    return {role:r.data.role, team_id:r.data.team_id, name:name, slot:slot};
  }
  return {
    live:true,
    async restore(){
      var s = await sb.auth.getSession();
      if(!s.data.session) return null;
      return profile(s.data.session.user.id, s.data.session.user.email);
    },
    async login(u, p){
      var em = (u || "").trim(); if(em.indexOf("@") < 0) em = em.toLowerCase() + "@" + CFG.domain;
      var r = await sb.auth.signInWithPassword({email:em, password:p});
      if(r.error){
        var lm = (r.error.message || "").toLowerCase();
        if(lm.indexOf("not confirmed") >= 0) throw new Error("unconfirmed");
        if(lm.indexOf("invalid login") >= 0) throw new Error("bad_login");
        throw new Error("detail:" + r.error.message);
      }
      try { return await profile(r.data.user.id, r.data.user.email); }
      catch(pe){ try { await sb.auth.signOut(); } catch(x){} throw new Error("no_profile"); }
    },
    async logout(){ await sb.auth.signOut(); },
    async load(me){
      var a = await Promise.all([
        sb.from("teams").select("*").order("name"),
        sb.from("workers").select("*").order("name"),
        sb.from("houses").select("*").order("created_at", {ascending:false})
      ]);
      a.forEach(function(x){ if(x.error) throw x.error; });
      var wd = await sb.from("worker_days").select("*");
      var sv = await sb.from("services").select("*").order("created_at", {ascending:false});
      var cl = await sb.from("cleanings").select("*").order("created_at", {ascending:false});
      var aj = await sb.from("adjustments").select("*").order("work_date", {ascending:false});
      var insH = (me && me.role === "inspector") ? await sb.rpc("inspector_houses") : null;
      var ins = await sb.from("inspections").select("*").order("created_at", {ascending:false}).limit(300);
      var scr = (me && me.role !== "inspector") ? await sb.from("supply_catalog").select("*") : null;
      var spp = (me && me.role !== "inspector") ? await sb.from("special_photos").select("*").order("created_at", {ascending:false}) : null;
      var spr = (me && me.role !== "inspector") ? await sb.from("supplies").select("*").order("created_at", {ascending:false}) : null;
      var plr = (me && me.role !== "team") ? await sb.from("inspector_plan").select("*") : null;
      var ros = (me && me.role === "inspector") ? await sb.rpc("inspector_roster") : null;
      var exr = (me && me.role !== "inspector") ? await sb.from("expenses").select("*").order("created_at", {ascending:false}) : null;
      var ipr = (me && (me.role === "superadmin" || me.role === "admin")) ? await sb.from("inspectors").select("*").order("slot") : null;
      return {supplyCat: (scr && !scr.error) ? scr.data : [], specialPhotos: (spp && !spp.error) ? spp.data : [], supplies: (spr && !spr.error) ? spr.data : [], inspPlan: (plr && !plr.error) ? plr.data : [], expenses: (exr && !exr.error) ? exr.data : [], inspectors: (ipr && !ipr.error) ? ipr.data : [], inspections: ins.error ? [] : ins.data, inspHouses: null, adjustments: aj.error ? [] : aj.data, teams:a[0].data, workers:(ros && !ros.error && ros.data && ros.data.workers) || a[1].data, houses:(insH && !insH.error && Array.isArray(insH.data)) ? insH.data : a[2].data, workerDays: (ros && !ros.error && ros.data && ros.data.days) || (wd.error ? [] : wd.data), services: sv.error ? [] : sv.data, cleanings: cl.error ? [] : cl.data};
    },
    async save(me, table, row){
      var r;
      if(row.id){ var id = row.id, patch = Object.assign({}, row); delete patch.id; r = await sb.from(table).update(patch).eq("id", id); }
      else { r = await sb.from(table).insert(row); }
      if(r.error) throw r.error;
    },
    async msgs(me){
      var r = await sb.from("messages").select("*").order("created_at", {ascending:true}).limit(400);
      if(r.error) throw r.error; return r.data;
    },
    async sendChat(me, teamId, body){
      var r = await sb.from("messages").insert({team_id:teamId, sender:me.role === "superadmin" ? "admin" : "team", body:body});
      if(r.error) throw r.error;
    },
    async readChat(me, teamId){
      var other = me.role === "superadmin" ? "team" : "admin";
      var r = await sb.from("messages").update({read_at:new Date().toISOString()}).eq("team_id", teamId).eq("sender", other).is("read_at", null);
      if(r.error) throw r.error;
    },
    async sendMsg(me, teamIds, text){
      var r = await sb.from("notifications").insert(teamIds.map(function(tid){ return {team_id:tid, kind:"message", title:text}; }));
      if(r.error) throw r.error;
    },
    async reopen(me, id){
      var r = await sb.rpc("reopen_job", {p_id:id});
      if(r.error) throw r.error;
    },
    async finish(me, table, id, label){
      var r = await sb.rpc("finish_job", {p_table:table, p_id:id, p_label:label || null});
      if(r.error) throw r.error;
    },
    async del(me, table, id){ var r = await sb.from(table).delete().eq("id", id); if(r.error) throw r.error; },
    async importAll(me, j){
      var steps = [["teams", j.teams, "id"], ["workers", j.workers, "id"], ["houses", j.houses, "id"], ["services", j.services || [], "id"], ["cleanings", j.cleanings || [], "id"], ["expenses", j.expenses || [], "id"], ["adjustments", j.adjustments || [], "id"], ["worker_days", j.worker_days || [], "worker_id,work_date"]];
      for(var i = 0; i < steps.length; i++){
        if(!steps[i][1].length) continue;
        var r = await sb.from(steps[i][0]).upsert(steps[i][1], {onConflict:steps[i][2]});
        if(r.error) throw r.error;
      }
    },
    async setDay(me, wid, day, val){
      var r;
      if(val === "") r = await sb.from("worker_days").delete().eq("worker_id", wid).eq("work_date", day);
      else r = await sb.from("worker_days").upsert({worker_id:wid, work_date:day, team_id: val === "off" ? null : val}, {onConflict:"worker_id,work_date"});
      if(r.error) throw r.error;
    },
    async notifs(){
      var r = await sb.from("notifications").select("*").order("created_at", {ascending:false}).limit(50);
      if(r.error) throw r.error;
      return r.data;
    },
    async purgeNotifs(me, iso){
      var r = await sb.from("notifications").delete().lt("created_at", iso);
      if(r.error) throw r.error;
    },
    async markRead(){
      var r = await sb.from("notifications").update({read_at:new Date().toISOString()}).is("read_at", null);
      if(r.error) throw r.error;
    },
    async photo(houseId, kind, blob){
      var path = houseId + "/" + kind + "-" + uid() + ".jpg";
      var up = await sb.storage.from("house-photos").upload(path, blob, {contentType:"image/jpeg"});
      if(up.error) throw up.error;
      return sb.storage.from("house-photos").getPublicUrl(path).data.publicUrl;
    }
  };
}

    return persist("inspections", {id:rr.id, deduct_workers:arr});
  }
  if(c === "inspded"){ var dv = Math.max(0, parseInt(el.value, 10) || 0), dr = {id:el.dataset.id}; dr[el.dataset.f] = dv; return persist("inspections", dr); }
  if(c === "workerinsp"){
    var slot = el.value ? parseInt(el.value, 10) : null;
    try {
      if(slot){ var oth = st.data.workers.filter(function(w){ return w.inspector_slot === slot && w.id !== el.dataset.id; }); for(var oi = 0; oi < oth.length; oi++) await db.save(st.me, "workers", {id:oth[oi].id, inspector_slot:null}); }
      await db.save(st.me, "workers", {id:el.dataset.id, inspector_slot:slot}); await refresh(); render(); toast(t("saved"));
    } catch(e){ console.error(e); toast(errMsg(e), "bad"); render(); }
    return;
  }
  if(c === "wkf" && el.dataset.f === "city"){ st.wk.f.city = el.value; st.wk.f.house = ""; st.wk.f.inn = ""; return render(); }
  if(c === "wkf"){ st.wk.f[el.dataset.f] = (el.dataset.f === "urgent" || el.dataset.f === "owner") ? el.checked : el.value; if(el.dataset.f === "house"){ st.wk.f.inn = ""; render(); } return; }
  if(c === "ascity"){ st.asCity = el.value; document.querySelectorAll('.pick[data-city]').forEach(function(n){ n.hidden = !!st.asCity && n.getAttribute("data-city") !== st.asCity; }); return; }
  if(c === "wkb"){ st.wk.b[el.dataset.f] = el.value; return; }
  if(c === "housday"){
    var dh = houseById(el.dataset.id); if(!dh) return;
    if(!dh.team_id){ toast(t("pickTeamFirst"), "bad"); return render(); }
    return doAssign([{h:dh, team:dh.team_id, date:el.value}]);
  }
  if(c === "calf"){ st.cal[el.dataset.f] = el.value; return; }
  if(c === "histteam"){ st.histTeam = el.value; return render(); }
  if(c === "histmonth"){ st.histMonth = el.value; return render(); }
  if(c === "svcf"){
    var fk = el.dataset.f;
    if(fk === "min") st.svc.min = Math.max(0, parseInt(el.value, 10) || 0);
    else st.svc[fk] = el.value;
    if(fk === "kind"){ st.svc.min = (SVC[el.value] || SVC.other).min; return render(); }
    return;
  }
  if(c === "svcteam") return persist("services", {id:el.dataset.id, team_id:el.value || null});
  if(c === "svcdate") return persist("services", {id:el.dataset.id, work_date:el.value || null});
  if(c === "svcmin") return persist("services", {id:el.dataset.id, planned_minutes:Math.max(0, parseInt(el.value, 10) || 0)});
  if(c === "svcextra") return persist("services", {id:el.dataset.id, extra_minutes:Math.max(0, parseInt(el.value, 10) || 0)});
  if(c === "rdate"){ st.rosterDate = el.value || curDate(); return render(); }
  if(c === "rosterteam") return setWorkerDay(el.dataset.id, el.value);
  if(c === "teamcount") return persist("teams", {id:el.dataset.id, workers_count:Math.max(0, parseInt(el.value, 10) || 0)});
  if(c === "citybulk"){
    if(el.value === "__") return;
    var city = el.dataset.city, tid2 = el.value === "none" ? null : el.value;
    var ids = st.data.houses.filter(function(h){ return (h.city || "").trim() === city && (!st.onlyUnassigned || !h.team_id); }).map(function(h){ return h.id; });
    return bulkAssign(ids, tid2, st.assignDay || tomorrowDate());
  }
  if(c === "housteam"){
    var hh0 = houseById(el.dataset.id); if(!hh0) return;
    var keep = hh0.team_id && hh0.work_date && status(hh0) !== "done";
    return doAssign([{h:hh0, team:el.value || null, date:keep ? hh0.work_date : (st.assignDay || tomorrowDate())}]);
  }
  if(c === "workerteam") return persist("workers", {id:el.dataset.id, team_id:el.value || null});
});

function row0(m){ return (st.data[m.table] || []).find(function(x){ return x.id === m.id; }); }
document.addEventListener("submit", async function(e){
  var f = e.target.closest("form[data-form]"); if(!f) return;
  e.preventDefault();
  if(f.dataset.form === "login"){
    var fd = new FormData(f);
    try {
      st.me = await db.login(fd.get("u"), fd.get("p")); st.loginErr = ""; st.tab = (st.me && st.me.role === "admin") ? "assign" : ((st.me && st.me.role === "inspector") ? "plan" : "houses"); st.teamFilter = ""; st.month = curMonth(); st.notifs = []; st.seen = {};
      st.chat = []; st._chatSeen = false; await refresh(); render(); loadNotifs(); loadChat();
    } catch(err){ st.me = null; st.loginErr = loginMsg(err); render(); }
    return;
  }
  if(f.dataset.form === "sup"){
    var sv = st.sup, nm = (sv.name || "").trim(), tgt = sv.team === "*" ? st.data.teams.map(function(x){ return x.id; }) : (sv.team ? [sv.team] : []);
    if(!nm || !tgt.length){ toast(t("supNeed"), "bad"); return; }
    try {
      for(var si = 0; si < tgt.length; si++) await db.save(st.me, "supplies", {team_id:tgt[si], kind:sv.kind, name:nm, qty:Math.max(0, parseInt(sv.qty, 10) || 1), note:(sv.note || "").trim() || null, sent_at:curDate(), custom:false});
      st.sup = {kind:sv.kind, name:"", qty:"1", team:sv.team, note:""}; await refresh(); render(); toast(t("supSentOk"));
    } catch(err){ console.error(err); toast(errMsg(err), "bad"); }
    return;
  }
  if(f.dataset.form === "supreq"){
    var rv = st.supReq, rn = (rv.name || "").trim();
    if(!rn){ toast(t("supNeed"), "bad"); return; }
    try {
      await db.save(st.me, "supplies", {team_id:st.me.team_id, kind:rv.kind, name:rn, qty:0, note:null, out_note:(rv.note || "").trim() || null, sent_at:curDate(), custom:true, out_at:new Date().toISOString()});
      st.supReq = {kind:rv.kind, name:"", note:""}; await refresh(); render(); toast(t("supOutOk"));
    } catch(err){ console.error(err); toast(errMsg(err), "bad"); }
    return;
  }
  if(f.dataset.form === "exp"){
    var ev = st.exp, eam = parseFloat(ev.amount);
    if(!(eam >= 0) || !isFinite(eam) || !ev.photo || !ev.worker){ toast(t("expNeed"), "bad"); return; }
    if(ev.kind === "other" && !(ev.note || "").trim()){ toast(t("expNoteNeed"), "bad"); return; }
    try {
      await db.save(st.me, "expenses", {team_id:st.me.team_id, worker_id:ev.worker, kind:ev.kind, amount:Math.round(eam * 100) / 100, note:(ev.note || "").trim() || null, photo:ev.photo, work_date:curDate(), status:"pending"});
      st.exp = {kind:ev.kind, amount:"", worker:ev.worker, note:"", photo:""}; await refresh(); render(); toast(t("expSent"));
    } catch(err){ console.error(err); toast(errMsg(err), "bad"); }
    return;
  }
  if(f.dataset.form === "insp"){
    var iv = st.insp;
    if(!iv.house || !iv.team || (!(iv.note || "").trim() && !(iv.photos || []).length)){ toast(t("inspNeed"), "bad"); return; }
    try {
      var ihs = iv.house ? houseById(iv.house) : null;
      await db.save(st.me, "inspections", {team_id:iv.team, house_id:ihs ? ihs.id : null, inspector_slot:st.me.slot || null, house_label:ihs ? ihs.name : null, note:(iv.note || "").trim() || null, photos:iv.photos || [], inspector:st.me.name, team_visible:iv.vis !== false});
      st.insp = {house:"", team:"", note:"", photos:[], vis:iv.vis !== false}; await refresh(); render(); toast(t("inspSent"));
    } catch(err){ console.error(err); toast(errMsg(err), "bad"); }
    return;
  }
  if(f.dataset.form === "chatsend"){
    var inp = $("#chat_in"), body = ((inp || {}).value || "").trim(), ct = chatTeamId();
    if(!body || !ct) return;
    inp.value = "";
    try { await db.sendChat(st.me, ct, body.slice(0, 280)); st.chat = await db.msgs(st.me); chatDom(); var cl3 = $("#chatlist"); if(cl3) cl3.scrollTop = cl3.scrollHeight; }
    catch(err){ console.error(err); inp.value = body; toast(errMsg(err), "bad"); }
    return;
  }
  if(f.dataset.form === "service"){
    var sf = st.svc;
    if(!sf.house || !sf.team){ toast(t("svcRequired"), "bad"); return; }
    try {
      await db.save(st.me, "services", {house_id:sf.house, kind:sf.kind, team_id:sf.team, work_date:sf.date || tomorrowDate(), planned_minutes:sf.min || 0, note:sf.note || ""});
      st.svc.note = ""; await refresh(); render(); toast(t("svcSent"));
    } catch(err){ console.error(err); toast(errMsg(err), "bad"); }
    return;
  }
  if(f.dataset.form === "assignw"){
    var tw = st.modal.id, chk = new FormData(f).getAll("w");
    try {
      for(var j = 0; j < st.data.workers.length; j++){
        var ww = st.data.workers[j], wantW = chk.indexOf(ww.id) >= 0, hasW = ww.team_id === tw;
        if(wantW && !hasW) await db.save(st.me, "workers", {id:ww.id, team_id:tw});
        else if(!wantW && hasW) await db.save(st.me, "workers", {id:ww.id, team_id:null});
      }
      await refresh(); st.modal = null; render(); toast(t("saved"));
    } catch(err){ console.error(err); toast(errMsg(err), "bad"); }
    return;
  }
  if(f.dataset.form === "assign"){
    var tid = st.modal.id, checked = new FormData(f).getAll("h");
    var items = [];
    st.data.houses.forEach(function(hh){
      var want = checked.indexOf(hh.id) >= 0, has = hh.team_id === tid;
      if(want && !has) items.push({h:hh, team:tid, date:hh.work_date || (st.assignDay || tomorrowDate())});
      else if(!want && has) items.push({h:hh, team:null});
    });
    st.modal = null;
    await doAssign(items);
    return;
  }
  var m = st.modal, def = formDef(m.table), data = new FormData(f), row = {};
  def.forEach(function(x){
    var v = data.get(x.k);
    if(x.type === "money"){ var mv = parseFloat(String(v || "").replace(",", ".")); if(isNaN(mv)){ if(m.id && row0(m) && row0(m)[x.k] != null) row[x.k] = null; return; } v = Math.max(0, Math.round(mv * 100) / 100); }
    else if(x.type === "number") v = Math.max(0, parseInt(v, 10) || 0);
    else if(x.type === "date") v = v || null;
    else if(x.type === "datetime-local") v = v ? new Date(v).toISOString() : null;
    else if(x.type === "select") v = v || null;
    else v = (v || "").trim();
    row[x.k] = v;
  });
  if(m.id) row.id = m.id;
  persist(m.table, row, function(){ st.modal = null; });
});

(async function boot(){
  var l = lsGet("pm-lang"); st.lang = (l === "fr" || l === "ar" || l === "nl") ? l : "ar";
  document.documentElement.lang = st.lang; document.documentElement.dir = st.lang === "ar" ? "rtl" : "ltr";
  try { var me = await db.restore(); if(me){ st.me = me; await refresh(); } } catch(e){ console.error(e); }
  render(); loadNotifs(); loadChat();
  setInterval(function(){ loadNotifs(); }, 30000);
  setInterval(function(){ loadChat(); }, 8000);
})();
