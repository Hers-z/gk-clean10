<!doctype html>

<style>
/* Layout: sticky top bar, tab row, one full-width table that turns into stacked cards on phones. */
:root{
  --bg:#F2F5F6; --surface:#FFFFFF; --surface2:#E8EEF0; --line:#D3DCE0; --fg:#10222A; --muted:#566B74;
  --accent:#0B7A86; --accent-fg:#FFFFFF; --accent-soft:#D5EDEF;
  --ok:#1B7F4B; --ok-soft:#DBF1E3; --warn:#9A5400; --warn-soft:#FBE8C8; --bad:#B3261E; --bad-soft:#F9DDDA;
  --f-display:"Cairo","IBM Plex Sans Arabic",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Arabic","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C1519; --surface:#142126; --surface2:#1B2D34; --line:#27404A; --fg:#E6EEF1; --muted:#93A8B1;
    --accent:#3CC1CE; --accent-fg:#06222A; --accent-soft:#12383E;
    --ok:#5FD08E; --ok-soft:#12301F; --warn:#F0B25A; --warn-soft:#3A2A10; --bad:#F2918A; --bad-soft:#3C1816;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C1519; --surface:#142126; --surface2:#1B2D34; --line:#27404A; --fg:#E6EEF1; --muted:#93A8B1;
  --accent:#3CC1CE; --accent-fg:#06222A; --accent-soft:#12383E;
  --ok:#5FD08E; --ok-soft:#12301F; --warn:#F0B25A; --warn-soft:#3A2A10; --bad:#F2918A; --bad-soft:#3C1816;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--f-body);min-height:100%;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
[hidden]{display:none!important}
img{max-width:100%}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1180px;margin-inline:auto;padding-bottom:48px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:11;background:var(--bg);display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding-block:12px;border-bottom:1px solid var(--line)}
.brand{font:800 20px/1 var(--f-display)}
.brand span{color:var(--accent)}
.spacer{flex:1 1 0}
.mode{font-size:12px;color:var(--muted);background:var(--surface2);padding:3px 10px;border-radius:99px;min-width:0}
.who{font-size:13px;color:var(--muted)}

.langs{display:flex;gap:2px;background:var(--surface2);border-radius:99px;padding:2px;direction:ltr}
.langs button{border:0;background:none;border-radius:99px;padding:5px 11px;cursor:pointer;font-size:13px;color:var(--muted)}
.langs button[aria-pressed="true"]{background:var(--surface);color:var(--fg);font-weight:600}
.bell{position:relative;gap:6px}
.badge{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:var(--bad);color:var(--surface);font-size:11px;font-weight:700}
.notif{display:flex;gap:10px;align-items:flex-start;width:100%;padding:10px 12px;border:0;border-top:1px solid var(--line);background:none;text-align:start;min-width:0}
.picklist .notif:first-child{border-top:0}
button.notif{cursor:pointer}
button.notif:hover{background:var(--surface2)}
.notif.unread{background:var(--accent-soft)}
.notif .t{flex:1;min-width:0}
.notif .t b,.notif .t span{display:block}
.notif .dot{flex:none;width:8px;height:8px;margin-top:7px;border-radius:99px;background:var(--accent);visibility:hidden}
.notif.unread .dot{visibility:visible}
.extrabox{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.extrabox label{flex:1 1 200px}
.subhead{padding:12px 14px 6px;font-size:13px;font-weight:600;color:var(--muted)}
.pad{padding:8px 14px;margin:0}
.wdet{border-top:1px solid var(--line);padding:8px 14px}
.wdet summary{cursor:pointer;padding:6px 0}
.tabs{display:flex;flex-wrap:wrap;gap:0 4px;margin-block:16px 0;border-bottom:1px solid var(--line)}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:10px 12px;cursor:pointer;color:var(--muted);font-weight:500;white-space:nowrap}
.tab[aria-current="true"]{color:var(--fg);border-bottom-color:var(--accent);font-weight:600}

h1,h2{font-family:var(--f-display);margin:0;line-height:1.25;text-wrap:balance}
h1{font-size:22px}
h2{font-size:17px}
.head{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;margin-block:20px 14px}
.head .spacer{flex:1 1 0}
.sub{color:var(--muted);font-size:14px;margin:4px 0 0}

.stats{display:flex;flex-wrap:wrap;gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:6px 12px;font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:baseline}
.stat b{font:800 18px var(--f-display);color:var(--fg);font-variant-numeric:tabular-nums}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:0 16px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:500}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:600}
.btn.primary:hover{filter:brightness(1.08);background:var(--accent)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.danger.sure{background:var(--bad);color:#fff}
.btn.ghost{background:none;border-color:transparent}
.btn.sm{min-height:32px;padding:0 10px;font-size:13px}
.btn.big{min-height:48px;font-size:16px;padding:0 22px}

select,input[type=text],input[type=password],input[type=number],input[type=datetime-local],input[type=date]{width:100%;min-height:40px;padding:0 10px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
input.num{width:72px;text-align:center;font-variant-numeric:tabular-nums}
.filter{width:auto;min-width:160px}

.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.tbl{border-collapse:collapse;width:100%;min-width:1340px}
.tbl th{font-size:12px;font-weight:600;color:var(--muted);text-align:start;padding:10px 12px;background:var(--surface2);white-space:nowrap;letter-spacing:.02em}
.tbl td{padding:10px 12px;border-top:1px solid var(--line);vertical-align:middle}
.tbl td.n{text-align:center;font-variant-numeric:tabular-nums}
.tbl .name .link{font-weight:600;font-size:15px}
.link{background:none;border:0;padding:0;color:var(--accent);cursor:pointer;text-align:start;text-decoration:underline;text-underline-offset:3px}
a.link{display:inline-block;font-size:13px}
.small{font-size:13px;color:var(--muted)}
.empty{padding:36px 16px;text-align:center;color:var(--muted)}
.nowrap{white-space:nowrap}
.rowact{display:flex;gap:6px;flex-wrap:wrap}

.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.pending{background:var(--surface2);color:var(--muted)}
.pill.progress{background:var(--warn-soft);color:var(--warn)}
.pill.done{background:var(--ok-soft);color:var(--ok)}
.pill.team{background:var(--accent-soft);color:var(--accent);font-family:var(--f-mono)}
.pill.none{background:var(--warn-soft);color:var(--warn)}
.code{font-family:var(--f-mono);font-weight:500;background:var(--surface2);border:1px dashed var(--line);border-radius:6px;padding:2px 10px;cursor:pointer;letter-spacing:.1em;direction:ltr;display:inline-block}

.overlay{position:fixed;inset:0;z-index:30;background:rgba(5,15,20,.6);overflow:auto;display:flex;justify-content:center;align-items:flex-start;
  padding:max(16px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.overlay.top2{z-index:40;align-items:center;background:rgba(0,0,0,.85)}
.modal{background:var(--surface);border-radius:12px;width:min(720px,100%);padding:20px;display:flex;flex-direction:column;gap:18px;min-width:0}
.mhead{display:flex;gap:12px;align-items:flex-start}
.mhead .spacer{flex:1 1 0}
.specs{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.spec{background:var(--surface2);border-radius:var(--r);padding:8px 12px}
.spec b{display:block;font:800 22px/1.2 var(--f-display);font-variant-numeric:tabular-nums}
.spec span{font-size:12px;color:var(--muted)}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px 16px}
.kv div span{display:block;font-size:12px;color:var(--muted)}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px;margin-top:8px}
.thumb{position:relative;aspect-ratio:1;border-radius:6px;overflow:hidden;background:var(--surface2);max-width:100%}
.thumb img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in}
.thumb .rm{position:absolute;top:4px;inset-inline-end:4px;width:26px;height:26px;border-radius:99px;border:0;background:rgba(0,0,0,.65);color:#fff;cursor:pointer;line-height:1}
.add{display:flex;align-items:center;justify-content:center;text-align:center;font-size:13px;color:var(--accent);border:1px dashed var(--accent);border-radius:6px;cursor:pointer;aspect-ratio:1;padding:6px;font-weight:600}
.add input{display:none}
.picklist{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);max-height:52vh;overflow:auto}
.pick{display:flex;gap:12px;align-items:center;padding:10px 12px;border-top:1px solid var(--line);cursor:pointer;min-width:0}
.pick:first-child{border-top:0}
.pick:hover{background:var(--surface2)}
.pick input{width:20px;height:20px;flex:none;accent-color:var(--accent)}
.pick .t{min-width:0;flex:1}
.pick .t b{display:block}
.city{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-top:14px;overflow:hidden}
.cityhead{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:10px 14px;background:var(--surface2)}
.cityhead h2{flex:1 1 140px;min-width:0}
.arow{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;padding:10px 14px;border-top:1px solid var(--line)}
.arow .t{flex:1 1 220px;min-width:0}
.arow .t b{display:block}
.btn.warn{color:var(--warn);border-color:var(--warn)}
.btn.stop{background:var(--bad);border-color:var(--bad);color:#fff;font-weight:600}
.pill.paused{background:var(--accent-soft);color:var(--accent)}
.grp{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-top:12px;overflow:hidden}
.gh{display:flex;align-items:center;gap:12px;width:100%;padding:12px 16px;min-height:60px;background:none;border:0;cursor:pointer;text-align:start}
.gh:hover{background:var(--surface2)}
.gh .gt{flex:1;min-width:0;font:700 17px/1.3 var(--f-display)}
.gh .gt small{display:block;font:400 13px var(--f-body);color:var(--muted)}
.gh .chev{flex:none;width:28px;height:28px;border-radius:99px;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--muted)}
.gbody{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,310px),1fr));gap:12px;padding:12px 14px 14px;border-top:1px solid var(--line)}
.hcard{border:1px solid var(--line);border-inline-start:4px solid var(--line);border-radius:10px;background:var(--bg);padding:12px 14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.hcard.s-progress{border-inline-start-color:var(--warn)}
.hcard.s-paused{border-inline-start-color:var(--accent)}
.hcard.s-done{border-inline-start-color:var(--ok)}
.hmain{display:flex;flex-direction:column;gap:3px;background:none;border:0;padding:0;text-align:start;cursor:pointer;min-width:0}
.hmain b{font:700 16px/1.3 var(--f-display)}
.hmain:hover b{color:var(--accent)}
.hrow{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px}
.fact{font-size:12px;background:var(--surface2);border-radius:6px;padding:2px 8px;color:var(--muted);white-space:nowrap}
.hacts{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto}
.hacts .btn{flex:1 1 auto}
.hacts select{flex:1 1 120px;min-height:32px;width:auto}
.tools{display:flex;gap:6px;flex-wrap:wrap}
.lb img{max-width:100%;max-height:90vh;border-radius:6px}

form.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px 14px}
form.grid .full{grid-column:1/-1}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);min-width:0}

.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding-block:32px}
.login .card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:24px;width:min(400px,100%);display:flex;flex-direction:column;gap:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--surface2);border:0;border-radius:99px;padding:4px 12px;font-family:var(--f-mono);font-size:12px;cursor:pointer;direction:ltr}
.err{color:var(--bad);font-size:13px;min-height:18px}

.toast{position:fixed;inset-inline:0;bottom:max(16px,env(safe-area-inset-bottom,0px));margin-inline:auto;width:max-content;max-width:calc(100% - 32px);z-index:60;background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:99px;font-weight:500}
.toast.bad{background:var(--bad);color:#fff}

/* ── Finition visuelle ── */
:root{--sh:0 1px 2px rgba(16,34,42,.06),0 8px 24px rgba(16,34,42,.06);--r:10px}
body{background:radial-gradient(900px 420px at 85% -8%,var(--accent-soft),transparent 65%),var(--bg);background-attachment:fixed}
.top{background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.brand{display:flex;align-items:center;gap:8px;letter-spacing:-.01em;direction:ltr}
.logo{font-style:normal;display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,var(--accent),#1AA6B4);color:var(--accent-fg);font-size:17px;box-shadow:0 4px 12px rgba(11,122,134,.3)}
.tabs{border-bottom:0;gap:6px;margin-block:14px 0;overflow-x:auto;flex-wrap:nowrap;padding-bottom:4px;scrollbar-width:thin}
.tab{border:1px solid var(--line);border-bottom:1px solid var(--line);border-radius:99px;padding:8px 16px;background:var(--surface);transition:background .15s,color .15s}
.tab:hover{background:var(--surface2)}
.tab[aria-current="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
h1{font-size:24px;letter-spacing:-.01em}
.stat{box-shadow:var(--sh);padding:10px 16px;border-radius:12px;border-inline-start:4px solid var(--accent)}
.stat b{font-size:22px}
.btn{transition:background .15s,transform .1s,box-shadow .15s}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(135deg,var(--accent),#1AA6B4);box-shadow:0 3px 10px rgba(11,122,134,.28)}
.grp,.city,.tablewrap,.login .card,.modal{box-shadow:var(--sh)}
.grp,.city{border-radius:14px}
.hcard{background:var(--surface);box-shadow:0 1px 2px rgba(16,34,42,.05);transition:box-shadow .15s,transform .15s}
.hcard:hover{box-shadow:var(--sh);transform:translateY(-2px)}
.cityhead{background:linear-gradient(90deg,var(--surface2),var(--surface))}
.arow{align-items:center}
.arow-x{flex:1 1 100%;display:flex;justify-content:flex-end}
.chipset{display:inline-flex;gap:6px;align-items:center;flex-wrap:wrap}
.upbar{position:fixed;inset-inline:0;top:max(12px,env(safe-area-inset-top,0px));margin-inline:auto;width:max-content;max-width:calc(100% - 32px);z-index:70;background:var(--accent);color:var(--accent-fg);padding:10px 18px;border-radius:99px;font-weight:600;box-shadow:var(--sh)}
.login{background:radial-gradient(700px 380px at 50% 0,var(--accent-soft),transparent 70%)}
.login .card{border-radius:18px;padding:28px}
.modal{border-radius:16px}
@media (max-width:760px){
  .tbl{min-width:0!important}
  .tbl,.tbl tbody,.tbl tr,.tbl td{display:block;min-width:0}
  .tbl thead{display:none}
  .tbl tr{padding:10px 14px;border-top:1px solid var(--line)}
  .tbl tr:first-child{border-top:0}
  .tbl td{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:4px 0;border:0;text-align:end}
  .tbl td::before{content:attr(data-label);color:var(--muted);font-size:12px;text-align:start;flex:none}
  .tbl td.name{justify-content:flex-start;padding-bottom:6px}
  .tbl td.name::before{display:none}
  .tbl td.n{text-align:end}
  .modal{padding:16px}
}
@media (prefers-reduced-motion:no-preference){.toast{animation:up .2s ease-out}@keyframes up{from{opacity:0;transform:translateY(8px)}}}
</style>

function dur(h){

  var hh = Math.floor(m / 60), mm = m % 60;

function hoursByDay(teamId, month){

  st.data.houses.forEach(function(h){
    var m = totalMin(h);
    if(h.team_id !== teamId || !(m > 0)) return;
    var k = dayKey(h);
    if(month && (!k || k.slice(0, 7) !== month)) return;
    if(!g[k]) g[k] = {key:k, count:0, total:0};
    g[k].count++; g[k].total += m;
  });

}

function workerMonth(w){
  var byKey = {}, rows = [];
  st.data.houses.forEach(function(h){
    var m = totalMin(h), k = dayKey(h);
    if(!h.team_id || !(m > 0) || !k || k.slice(0, 7) !== st.month) return;
    var key = k + "|" + h.team_id;
    if(!byKey[key]) byKey[key] = {day:k, team:h.team_id, count:0, total:0};
    byKey[key].count++; byKey[key].total += m;
  });
  Object.keys(byKey).sort().forEach(function(key){
    var g = byKey[key];
    if(effTeam(w, g.day) !== g.team) return;
    var n = teamSizeOn(g.team, g.day);
    if(n) rows.push({day:g.day, team:g.team, count:g.count, share:g.total / n});
  });
  var houses = 0, share = 0;
  rows.forEach(function(r){ houses += r.count; share += r.share; });

function exportInvoices(){

    var rows = workerHouseRows(w);
    if(!rows.length) return;
    var days = {}; rows.forEach(function(r){ days[r.day] = 1; });
    var dayList = Object.keys(days).sort();
    var hh = 0; rows.forEach(function(r){ hh += r.share; });
    var th = dayList.length * TRAVEL_MIN, tot = R(hrs(hh) + hrs(th));

      [t("workerCol"), w.name], [t("defaultTeam"), dteam ? dteam.name : ""], [t("month"), monthLabel(st.month)], [t("hourlyRate"), rate], [],
      [t("dayCol"), t("team"), t("house"), t("city"), t("address"), t("planned"), t("extra"), "🧼", t("totalHours") + " (" + t("house") + ")", t("workersN"), t("perWorker"), t("start"), t("end"), t("duration"), t("status")]
    ];
    rows.forEach(function(r){
      var h = r.h, tm = teamById(h.team_id);
      aoa.push([r.day, tm ? tm.name : "", h.name, h.city || "", h.address || "", hrs(h.cleaning_minutes || 0), hrs(h.extra_minutes || 0), h.clean_found ? hrs(h.credit_minutes || 0) : "", hrs(r.total), r.n, hrs(r.share), h.start_at ? fmt(h.start_at) : "", h.end_at ? fmt(h.end_at) : "", dur(h) === "—" ? "" : dur(h), t("st_" + status(h))]);
    });
    aoa.push([]);
    dayList.forEach(function(d){ var e = []; e[0] = d; e[2] = t("travel"); e[10] = hrs(TRAVEL_MIN); aoa.push(e); });
    aoa.push([]);
    var e1 = []; e1[2] = t("houseHours"); e1[10] = hrs(hh); aoa.push(e1);
    var e2 = []; e2[2] = t("travelHours"); e2[10] = hrs(th); aoa.push(e2);
    var e3 = []; e3[2] = t("totalHours"); e3[10] = tot; aoa.push(e3);
    var e4 = []; e4[2] = t("amount"); e4[10] = R(tot * rate); aoa.push(e4);
    var ws = XLSX.utils.aoa_to_sheet(aoa);
    ws["!cols"] = [{wch:12}, {wch:8}, {wch:26}, {wch:14}, {wch:34}, {wch:10}, {wch:10}, {wch:8}, {wch:14}, {wch:10}, {wch:14}, {wch:14}, {wch:14}, {wch:12}, {wch:14}];
    var nm = String(w.name).replace(/[\\\/\?\*\[\]:]/g, "").slice(0, 28) || "worker", k = nm, i = 2;
    while(used[k]) k = nm.slice(0, 25) + "_" + (i++);
    used[k] = 1;
    XLSX.utils.book_append_sheet(wb, ws, k);
  });

async function compress(file){
  var max = LIVE ? 1280 : 800, q = LIVE ? 0.72 : 0.6, src, w, h, bmp = null, url = null;
  try { bmp = await createImageBitmap(file, {imageOrientation:"from-image"}); src = bmp; w = bmp.width; h = bmp.height; }
  catch(e){
    url = URL.createObjectURL(file);
    src = await new Promise(function(res, rej){ var im = new Image(); im.onload = function(){ res(im); }; im.onerror = rej; im.src = url; });
    w = src.naturalWidth; h = src.naturalHeight;
  }
  var sc = Math.min(1, max / Math.max(w, h)), c = document.createElement("canvas");
  c.width = Math.round(w * sc); c.height = Math.round(h * sc);
  c.getContext("2d").drawImage(src, 0, 0, c.width, c.height);
  if(bmp && bmp.close) bmp.close();
  if(url) URL.revokeObjectURL(url);
  return await new Promise(function(res, rej){ c.toBlob(function(b){ b ? res(b) : rej(new Error("compress")); }, "image/jpeg", q); });
}

async function uploadPhotos(hid, kind, files){
  var total = files.length, done = 0, failed = 0, next = 0, last = null;
  upBar(t("uploading") + " 0/" + total + " · " + t("photoWait"));
  async function worker(){
    while(next < total){
      var f = files[next++];
      try {
        var blob = await compress(f), url = null, tries = 0;
        while(true){
          try { url = await db.photo(hid, kind, blob); break; }
          catch(e){ if(e && e.message === "storage_full") throw e; if(++tries > 2) throw e; await new Promise(function(r){ setTimeout(r, 700 * tries); }); }
        }
        await saveUrl(hid, kind, url); done++;
      } catch(e){ failed++; last = e; console.error(e); }
      upBar(t("uploading") + " " + (done + failed) + "/" + total + " · " + t("photoWait"));
    }
  }
  await Promise.all([worker(), worker(), worker()]);
  upBar(null);
  try { await refresh(); } catch(e){}
  render();
  if(failed) toast(t("uploadFail").replace("{n}", failed) + (last && last.message === "storage_full" ? " " + t("storageFull") : (LIVE && last && last.message ? " (" + last.message + ")" : "")), "bad");
  else toast(t("saved"));
}

      if(tm && p === "1234") return {role:"team", team_id:tm.id, name:tm.name};

      if(me.role === "team"){

        var mine = {}, defTeam = {};
        c.workerDays.forEach(function(r){ if(r.team_id === me.team_id) mine[r.worker_id] = 1; });
        c.workers.forEach(function(w){ defTeam[w.id] = w.team_id; });

      }
      return c;

      if(me.role === "team"){
        var h = S.houses.find(function(x){ return x.id === row.id; });
        if(table !== "houses" || !h || h.team_id !== me.team_id) throw new Error("denied");
        ["start_at","end_at","paused_at","paused_seconds","clean_found","credit_minutes","before_photos","after_photos","extra_minutes"].forEach(function(k){ if(k in row) h[k] = row[k]; });
      } else {
        var list = S[table], i = row.id ? list.findIndex(function(x){ return x.id === row.id; }) : -1;
        var old = i >= 0 ? JSON.parse(JSON.stringify(list[i])) : null;
        if(i >= 0) Object.assign(list[i], row);
        else list.push(Object.assign({id:uid(), created_at:new Date().toISOString()}, table === "houses" ? {before_photos:[], after_photos:[], extra_minutes:0} : {}, row));
        if(table === "houses"){
          var nh = i >= 0 ? list[i] : list[list.length - 1];
          if(!old) notify(nh.team_id || null, nh, "assigned");
          else if((old.team_id || null) !== (nh.team_id || null)){ notify(nh.team_id || null, nh, "assigned"); notify(old.team_id || null, nh, "removed"); }
          else if(nh.team_id && (old.cleaning_minutes !== nh.cleaning_minutes || old.work_date !== nh.work_date || old.address !== nh.address || old.door_code !== nh.door_code)) notify(nh.team_id, nh, "updated");
        }
      }
      if(!persistS()){ S = JSON.parse(snap); throw new Error("storage_full"); }
    },
    async del(me, table, id){
      if(me.role !== "superadmin") throw new Error("denied");
      S[table] = S[table].filter(function(x){ return x.id !== id; });
      S.workerDays = (S.workerDays || []).filter(function(r){ return !(table === "workers" && r.worker_id === id) && !(table === "teams" && r.team_id === id); });
      if(table === "teams"){
        S.houses.forEach(function(h){ if(h.team_id === id) h.team_id = null; });
        S.workers.forEach(function(w){ if(w.team_id === id) w.team_id = null; });
      }
      persistS();
    },
    async importAll(me, j){
      function merge(key, rows){ rows.forEach(function(r){ var i = S[key].findIndex(function(x){ return x.id === r.id; }); if(i >= 0) S[key][i] = r; else S[key].push(r); }); }
      if(!S.workerDays) S.workerDays = [];
      merge("teams", j.teams); merge("workers", j.workers); merge("houses", j.houses);
      (j.worker_days || []).forEach(function(r){ S.workerDays = S.workerDays.filter(function(x){ return !(x.worker_id === r.worker_id && x.work_date === r.work_date); }); S.workerDays.push(r); });
      if(!persistS()) throw new Error("storage_full");
    },
    async setDay(me, wid, day, val){
      S.workerDays = S.workerDays.filter(function(r){ return !(r.worker_id === wid && r.work_date === day); });
      if(val !== "") S.workerDays.push({worker_id:wid, work_date:day, team_id: val === "off" ? null : val});
      persistS();
    },
    async notifs(me){ return S.notifs.filter(function(n){ return n.team_id === me.team_id; }).sort(function(a, b){ return a.created_at < b.created_at ? 1 : -1; }).slice(0, 50).map(function(n){ return Object.assign({}, n); }); },
    async markRead(me){ var now = new Date().toISOString(); S.notifs.forEach(function(n){ if(n.team_id === me.team_id && !n.read_at) n.read_at = now; }); persistS(); },
    async photo(houseId, kind, blob){ return await blobToDataUrl(blob); }
  };
}

/* ───────── Base de données : Supabase ───────── */
function baseUrl(){
  var u = (CFG.url || "").trim();
  var m = /supabase\.com\/dashboard\/project\/([a-z0-9]+)/i.exec(u);
  if(m) return "https://" + m[1] + ".supabase.co";
  try { return new URL(u).origin; } catch(e){ return u; }
}
function liveDb(){
  var sb = window.supabase.createClient(baseUrl(), (CFG.key || "").trim());
  async function profile(uid_, email){
    var r = await sb.from("profiles").select("role,team_id").eq("id", uid_).single();
    if(r.error) throw r.error;
    var name = email;
    if(r.data.team_id){ var tr = await sb.from("teams").select("name").eq("id", r.data.team_id).single(); if(tr.data) name = tr.data.name; }
    return {role:r.data.role, team_id:r.data.team_id, name:name};
  }
  return {
    live:true,
    async restore(){
      var s = await sb.auth.getSession();
      if(!s.data.session) return null;
      return profile(s.data.session.user.id, s.data.session.user.email);
    },
    async login(u, p){
      var em = (u || "").trim(); if(em.indexOf("@") < 0) em = em.toLowerCase() + "@" + CFG.domain;
      var r = await sb.auth.signInWithPassword({email:em, password:p});
      if(r.error){
        var lm = (r.error.message || "").toLowerCase();
        if(lm.indexOf("not confirmed") >= 0) throw new Error("unconfirmed");
        if(lm.indexOf("invalid login") >= 0) throw new Error("bad_login");
        throw new Error("detail:" + r.error.message);
      }
      try { return await profile(r.data.user.id, r.data.user.email); }
      catch(pe){ try { await sb.auth.signOut(); } catch(x){} throw new Error("no_profile"); }
    },
    async logout(){ await sb.auth.signOut(); },
    async load(){
      var a = await Promise.all([
        sb.from("teams").select("*").order("name"),
        sb.from("workers").select("*").order("name"),
        sb.from("houses").select("*").order("created_at", {ascending:false})
      ]);
      a.forEach(function(x){ if(x.error) throw x.error; });
      var wd = await sb.from("worker_days").select("*");
      return {teams:a[0].data, workers:a[1].data, houses:a[2].data, workerDays: wd.error ? [] : wd.data};
    },
    async save(me, table, row){
      var r;
      if(row.id){ var id = row.id, patch = Object.assign({}, row); delete patch.id; r = await sb.from(table).update(patch).eq("id", id); }
      else { r = await sb.from(table).insert(row); }
      if(r.error) throw r.error;
    },
    async del(me, table, id){ var r = await sb.from(table).delete().eq("id", id); if(r.error) throw r.error; },
    async importAll(me, j){
      var steps = [["teams", j.teams, "id"], ["workers", j.workers, "id"], ["houses", j.houses, "id"], ["worker_days", j.worker_days || [], "worker_id,work_date"]];
      for(var i = 0; i < steps.length; i++){
        if(!steps[i][1].length) continue;
        var r = await sb.from(steps[i][0]).upsert(steps[i][1], {onConflict:steps[i][2]});
        if(r.error) throw r.error;
      }
    },
    async setDay(me, wid, day, val){
      var r;
      if(val === "") r = await sb.from("worker_days").delete().eq("worker_id", wid).eq("work_date", day);
      else r = await sb.from("worker_days").upsert({worker_id:wid, work_date:day, team_id: val === "off" ? null : val}, {onConflict:"worker_id,work_date"});
      if(r.error) throw r.error;
    },
    async notifs(){
      var r = await sb.from("notifications").select("*").order("created_at", {ascending:false}).limit(50);
      if(r.error) throw r.error;
      return r.data;
    },
    async markRead(){
      var r = await sb.from("notifications").update({read_at:new Date().toISOString()}).is("read_at", null);
      if(r.error) throw r.error;
    },
    async photo(houseId, kind, blob){
      var path = houseId + "/" + kind + "-" + uid() + ".jpg";
      var up = await sb.storage.from("house-photos").upload(path, blob, {contentType:"image/jpeg"});
      if(up.error) throw up.error;
      return sb.storage.from("house-photos").getPublicUrl(path).data.publicUrl;
    }
  };
}

function formDef(table){

    {k:"double_beds", type:"number", label:"dbl"}, {k:"single_beds", type:"number", label:"sgl"},
    {k:"bathrooms", type:"number", label:"bath"}, {k:"toilets", type:"number", label:"wc"},
    {k:"cleaning_minutes", type:"number", label:"plannedMin"}, {k:"extra_minutes", type:"number", label:"extraMin"}, {k:"work_date", type:"date", label:"workDate"},
    {k:"door_code", type:"text", label:"code"}, {k:"team_id", type:"select", label:"team"},
    {k:"start_at", type:"datetime-local", label:"start"}, {k:"end_at", type:"datetime-local", label:"end"}

async function loadNotifs(){
  if(!st.me || st.me.role !== "team") return;
  try {
    var list = await db.notifs(st.me), fresh = list.filter(function(n){ return !n.read_at && !st.seen[n.id]; });
    list.forEach(function(n){ st.seen[n.id] = 1; });
    st.notifs = list; updateBell();
    if(fresh.length){
      toast(t("newNotifs"));
      try { if(window.Notification && Notification.permission === "granted") new Notification("Planning Ménage", {body:notifText(fresh[0])}); } catch(e){}
    }
    if(st.modal && st.modal.type === "notifs") render();
  } catch(e){ console.error(e); }
}
async function markAllRead(silent){
  try {
    await db.markRead(st.me);
    var now = new Date().toISOString();
    (st.notifs || []).forEach(function(n){ if(!n.read_at) n.read_at = now; });
    updateBell(); if(!silent) render();
  } catch(e){ console.error(e); }
}

function lightbox(){
  var l = st.lightbox; if(!l) return "";
  var h = houseById(l.id); var src = h && (h[l.kind + "_photos"] || [])[l.i];
  if(!src) return "";
  return '<div class="overlay top2 lb" data-act="unzoom"><img src="' + esc(src) + '" alt=""></div>';
}

function view(){
  if(!isSuper()) return housesView();
  return st.tab === "data" ? dataView() : st.tab === "roster" ? rosterView() : (st.tab === "hours" ? hoursView() : (st.tab === "assign" ? assignView() : (st.tab === "teams" ? teamsView() : (st.tab === "workers" ? workersView() : housesView()))));
}

function render(){
  var app = $("#app");
  if(!st.me){ app.innerHTML = loginView(); return; }
  var modal = "";
  if(st.modal) modal = st.modal.type === "house" ? houseModal() : (st.modal.type === "assign" ? assignModal() : (st.modal.type === "assignw" ? assignWorkersModal() : (st.modal.type === "notifs" ? notifModal() : formModal())));
  app.innerHTML = header() + tabs() + '<main>' + view() + '</main>' + modal + lightbox();
}

/* ───────── Actions ───────── */
function loginMsg(e){
  var m = (e && e.message) || "";
  if(m === "unconfirmed") return t("errUnconfirmed");
  if(m === "no_profile") return t("errNoProfile");
  if(m.indexOf("detail:") === 0) return m.slice(7);
  return t("badLogin");
}
function errMsg(e){
  var m = e && e.message;
  if(m === "storage_full") return t("storageFull");
  if(m === "denied") return t("denied");
  return t("errGeneric") + (LIVE && m ? " (" + m + ")" : "");
}
async function refresh(){ st.data = await db.load(st.me); }
async function persist(table, row, after){
  try {
    await db.save(st.me, table, row);
    await refresh();
    if(after) after();
    render(); toast(t("saved"));
  } catch(e){ console.error(e); toast(errMsg(e), "bad"); }
}

async function bulkAssign(ids, tid, day){
  try {
    for(var i = 0; i < ids.length; i++){ var r = {id:ids[i], team_id:tid}; if(tid && day) r.work_date = day; await db.save(st.me, "houses", r); }
    await refresh(); render(); toast(t("saved"));
  } catch(e){ console.error(e); toast(errMsg(e), "bad"); }
}

async function act(a, d){
  if(a !== "del") st.confirm = null;
  if(a === "setlang") return setLang(d.l);
  if(a === "fill"){ $("#lu").value = d.u; $("#lp").value = d.p; return; }
  if(a === "logout"){ try { await db.logout(); } catch(e){} st.me = null; st.modal = null; st.loginErr = ""; st.notifs = []; st.seen = {}; st.open = {}; st.month = curMonth(); return render(); }
  if(a === "aday"){ st.assignDay = d.d; return render(); }
  if(a === "cleanfound"){
    var hc = houseById(d.id); if(!hc) return;
    var cm = Math.max(0, parseInt(($("#clean_in") || {}).value, 10) || 0), nowc = new Date().toISOString(), pc = {id:hc.id, clean_found:true, credit_minutes:cm};
    if(!hc.start_at) pc.start_at = nowc;
    if(!hc.end_at) pc.end_at = nowc;
    if(hc.paused_at){ pc.paused_at = null; }
    return persist("houses", pc);
  }
  if(a === "cleanundo") return persist("houses", {id:d.id, clean_found:false, credit_minutes:0});
  if(a === "removeday"){ return persist("houses", {id:d.id, team_id:null, work_date:null}, function(){ toast(t("removedDay")); }); }
  if(a === "addextra"){ var hx = houseById(d.id); if(!hx) return; return persist("houses", {id:hx.id, extra_minutes:(hx.extra_minutes || 0) + (parseInt(d.m, 10) || 0)}); }
  if(a === "setday") return persist("houses", {id:d.id, work_date:d.d});
  if(a === "xlsxinv") return exportInvoices();
  if(a === "xlsxall") return exportAllXlsx();
  if(a === "backup") return exportBackup();
  if(a === "tab"){ st.tab = d.tab; return render(); }
  if(a === "open"){ var fromN = st.modal && st.modal.type === "notifs"; st.modal = {type:"house", id:d.id}; render(); if(fromN) markAllRead(true); return; }
  if(a === "notifs"){ st.modal = {type:"notifs"}; return render(); }
  if(a === "markread") return markAllRead(false);
  if(a === "enablealerts"){ try { await Notification.requestPermission(); } catch(e){} return render(); }
  if(a === "saveextra"){ var xv = Math.max(0, parseInt(($("#extra_in") || {}).value, 10) || 0); return persist("houses", {id:d.id, extra_minutes:xv}); }
  if(a === "close"){ var wasN = st.modal && st.modal.type === "notifs"; st.modal = null; st.lightbox = null; render(); if(wasN) markAllRead(true); return; }
  if(a === "reveal"){ st.reveal[d.id] = !st.reveal[d.id]; return render(); }
  if(a === "new"){ st.modal = {type:"form", table:d.table, id:null}; return render(); }
  if(a === "edit"){ st.modal = {type:"form", table:d.table, id:d.id}; return render(); }
  if(a === "onlyun"){ st.onlyUnassigned = !st.onlyUnassigned; return render(); }
  if(a === "assignw"){ st.modal = {type:"assignw", id:d.id}; return render(); }
  if(a === "assign"){ st.modal = {type:"assign", id:d.id}; return render(); }
  if(a === "zoom"){ st.lightbox = {id:d.id, kind:d.kind, i:+d.i}; return render(); }
  if(a === "unzoom"){ st.lightbox = null; return render(); }
  if(a === "fold"){ st.open[d.key] = !isOpen(d.key, st._gkeys.length === 1); return render(); }
  if(a === "foldall"){ st._gkeys.forEach(function(k){ st.open[k] = d.v === "1"; }); return render(); }
  if(a === "start" || a === "pause" || a === "stop"){
    var hh = houseById(d.id); if(!hh) return;
    var now = new Date(), patch2 = {id:hh.id};
    var back = hh.paused_at ? (hh.paused_seconds || 0) + Math.max(0, Math.round((now - new Date(hh.paused_at)) / 1000)) : (hh.paused_seconds || 0);
    if(a === "start"){
      if(!hh.start_at) patch2.start_at = now.toISOString();
      else if(hh.paused_at){ patch2.paused_seconds = back; patch2.paused_at = null; }
    } else if(a === "pause"){
      if(hh.start_at && !hh.end_at && !hh.paused_at) patch2.paused_at = now.toISOString();
    } else {
      if(!hh.start_at) patch2.start_at = now.toISOString();
      patch2.end_at = now.toISOString();
      if(hh.paused_at){ patch2.paused_seconds = back; patch2.paused_at = null; }
    }
    return persist("houses", patch2);
  }
  if(a === "rmphoto"){
    var h = houseById(d.id); if(!h) return;
    var arr = (h[d.kind + "_photos"] || []).filter(function(_, i){ return i !== +d.i; });
    var patch = {id:h.id}; patch[d.kind + "_photos"] = arr;
    return persist("houses", patch);
  }
  if(a === "del"){ st.confirm = d.table + ":" + d.id; return render(); }
  if(a === "delok"){
    try {
      await db.del(st.me, d.table, d.id); st.modal = null; st.confirm = null;
      await refresh(); render(); toast(t("deleted"));
    } catch(e){ console.error(e); toast(errMsg(e), "bad"); }
  }
}

document.addEventListener("click", function(e){
  var el = e.target.closest("[data-act]");
  if(el){ act(el.dataset.act, el.dataset); return; }
  if(e.target.classList && e.target.classList.contains("overlay") && !e.target.classList.contains("top2")){ act("close", {}); }
});
document.addEventListener("keydown", function(e){
  if(e.key === "Escape" && (st.modal || st.lightbox)){ if(st.lightbox) st.lightbox = null; else st.modal = null; render(); }
});

document.addEventListener("change", async function(e){
  var el = e.target;
  if(el.dataset.upload){
    var files = Array.prototype.slice.call(el.files || []), hid = el.dataset.id, kind = el.dataset.upload;
    el.value = "";
    if(!files.length || !houseById(hid)) return;
    return uploadPhotos(hid, kind, files);
  }
  var c = el.dataset.change; if(!c) return;
  if(c === "tf"){ st.teamFilter = el.value; return render(); }
  if(c === "month"){ st.month = el.value; return render(); }
  if(c === "rate"){ st.rate = el.value; try { localStorage.setItem("pm-rate", st.rate); } catch(x){} return; }
  if(c === "import"){ var f = el.files && el.files[0]; el.value = ""; if(f) importBackup(f); return; }
  if(c === "adate"){ st.assignDay = el.value || tomorrowDate(); return render(); }
  if(c === "rdate"){ st.rosterDate = el.value || curDate(); return render(); }
  if(c === "rosterteam") return setWorkerDay(el.dataset.id, el.value);
  if(c === "teamcount") return persist("teams", {id:el.dataset.id, workers_count:Math.max(0, parseInt(el.value, 10) || 0)});
  if(c === "citybulk"){
    if(el.value === "__") return;
    var city = el.dataset.city, tid2 = el.value === "none" ? null : el.value;
    var ids = st.data.houses.filter(function(h){ return (h.city || "").trim() === city && (!st.onlyUnassigned || !h.team_id); }).map(function(h){ return h.id; });
    return bulkAssign(ids, tid2, st.assignDay || tomorrowDate());
  }
  if(c === "housteam"){
    var hh0 = houseById(el.dataset.id), row = {id:el.dataset.id, team_id:el.value || null};
    if(el.value) row.work_date = (hh0 && hh0.team_id && hh0.work_date) ? hh0.work_date : (st.assignDay || tomorrowDate());
    return persist("houses", row);
  }
  if(c === "workerteam") return persist("workers", {id:el.dataset.id, team_id:el.value || null});
});

document.addEventListener("submit", async function(e){
  var f = e.target.closest("form[data-form]"); if(!f) return;
  e.preventDefault();
  if(f.dataset.form === "login"){
    var fd = new FormData(f);
    try {
      st.me = await db.login(fd.get("u"), fd.get("p")); st.loginErr = ""; st.tab = "houses"; st.teamFilter = ""; st.month = curMonth(); st.notifs = []; st.seen = {};
      await refresh(); render(); loadNotifs();
    } catch(err){ st.me = null; st.loginErr = loginMsg(err); render(); }
    return;
  }
  if(f.dataset.form === "assignw"){
    var tw = st.modal.id, chk = new FormData(f).getAll("w");
    try {
      for(var j = 0; j < st.data.workers.length; j++){
        var ww = st.data.workers[j], wantW = chk.indexOf(ww.id) >= 0, hasW = ww.team_id === tw;
        if(wantW && !hasW) await db.save(st.me, "workers", {id:ww.id, team_id:tw});
        else if(!wantW && hasW) await db.save(st.me, "workers", {id:ww.id, team_id:null});
      }
      await refresh(); st.modal = null; render(); toast(t("saved"));
    } catch(err){ console.error(err); toast(errMsg(err), "bad"); }
    return;
  }
  if(f.dataset.form === "assign"){
    var tid = st.modal.id, checked = new FormData(f).getAll("h");
    try {
      for(var k = 0; k < st.data.houses.length; k++){
        var hh = st.data.houses[k], want = checked.indexOf(hh.id) >= 0, has = hh.team_id === tid;
        if(want && !has) await db.save(st.me, "houses", {id:hh.id, team_id:tid});
        else if(!want && has) await db.save(st.me, "houses", {id:hh.id, team_id:null});
      }
      await refresh(); st.modal = null; render(); toast(t("saved"));
    } catch(err){ console.error(err); toast(errMsg(err), "bad"); }
    return;
  }
  var m = st.modal, def = formDef(m.table), data = new FormData(f), row = {};
  def.forEach(function(x){
    var v = data.get(x.k);
    if(x.type === "number") v = Math.max(0, parseInt(v, 10) || 0);
    else if(x.type === "date") v = v || null;
    else if(x.type === "datetime-local") v = v ? new Date(v).toISOString() : null;
    else if(x.type === "select") v = v || null;
    else v = (v || "").trim();
    row[x.k] = v;
  });
  if(m.id) row.id = m.id;
  persist(m.table, row, function(){ st.modal = null; });
});

/* ───────── Démarrage ───────── */
(async function boot(){
  var l = lsGet("pm-lang"); st.lang = (l === "fr" || l === "ar" || l === "nl") ? l : "ar";
  document.documentElement.lang = st.lang; document.documentElement.dir = st.lang === "ar" ? "rtl" : "ltr";
  try { var me = await db.restore(); if(me){ st.me = me; await refresh(); } } catch(e){ console.error(e); }
  render(); loadNotifs();
  setInterval(function(){ loadNotifs(); }, 30000);
})();
})();
</script>
